name: Offline public checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform coverage (use windows-only after unchanged server sources already passed)
        type: choice
        options: [all, windows-only]
        default: all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows-only' && '[{"os":"windows-latest","shard":"core"},{"os":"windows-latest","shard":"reports"}]' || '[{"os":"ubuntu-latest","shard":"all"},{"os":"macos-latest","shard":"all"},{"os":"windows-latest","shard":"core"},{"os":"windows-latest","shard":"reports"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CJK font for offline Linux report tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.lock -r requirements-research.lock -r requirements-paper.lock
      - run: python -m pip install --no-build-isolation -e ".[parquet]"
      - name: Public source, syntax, links and complete Git history
        run: python tools/release_audit.py --history
      - name: Frozen deployment content and exclusive recovery staging
        run: |
          python tools/recovery_bundle.py verify
          python tools/recovery_bundle.py stage --output ../ver1.0-ci-stage
      - name: Python indentation format check (standard library)
        run: python -m tabnanny src tests tools examples
      - name: Verify complete test partition
        run: python tools/run_public_tests.py --verify-partition
      - name: Offline synthetic and rejection tests (no API credentials)
        run: python tools/run_public_tests.py --shard ${{ matrix.shard }}
      - name: Build distributable package
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist
  publication-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/dependency_audit.py
      - run: python tools/publication_gate.py

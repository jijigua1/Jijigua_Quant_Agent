id = "mock_research"
version = "1.0.0"
contract_version = "research-v1"
summary = "用固定模拟量价数据验证研究计划、授权调用、窗口对照与摘要。"
depends_on = ["contracts-v1"]
validator = "mock_research_v1"

[tools]
query_mock_data = "1.0.0"
compute_mock_factor = "1.0.0"

[permissions]
data_paths = ["resource:mock:ohlcv-v1"]
write_scopes = []
network = "none"
gpu = false
risk_level = "L0"
requires_approval = false

[budget]
max_iterations = 4
max_model_calls = 8
max_tool_calls = 6
max_jobs = 0
cpu_cores = 1
memory_mib = 64
pids = 1
job_wall_seconds = 1
output_mib = 0

[acceptance]
cases = ["mock_research_smoke"]
stop_on = ["authorization_denied", "tool_error", "budget_exhausted"]

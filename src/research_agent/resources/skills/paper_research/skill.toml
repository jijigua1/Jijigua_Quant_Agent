id = "paper_research"
version = "1.0.0"
contract_version = "research-v1"
summary = "读取用户上传的论文，核对原文证据后提取因子，自动选择DSL或经人工审核的新算法，完成Train/Validation研究与2026滚动Test，交付PKL与三阶段报告。"
depends_on = ["contracts-v1"]
validator = "quant_research_v1"

[tools]
paper_list = "0.4.0"
qrtk_paper_research = "0.4.0"
qrtk_read_study = "0.4.0"

[permissions]
data_paths = ["resource:catalog"]
write_scopes = ["research_runs"]
network = "none"
gpu = false
risk_level = "L0"
requires_approval = false

[budget]
max_iterations = 3
max_model_calls = 14
max_tool_calls = 3
max_jobs = 0
cpu_cores = 1
memory_mib = 4096
pids = 1
job_wall_seconds = 600
output_mib = 512

[acceptance]
cases = ["quant_research_smoke"]
stop_on = ["authorization_denied", "tool_error", "budget_exhausted"]

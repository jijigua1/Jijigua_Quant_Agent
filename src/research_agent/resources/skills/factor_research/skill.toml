id = "factor_research"
version = "0.5.0"
contract_version = "research-v1"
summary = "使用受控Train/Validation评价因子，自动交付PKL、年度月度指标、HAC及离线交互报告；独立Test仅提交审批申请。"
depends_on = ["contracts-v1"]
validator = "quant_research_v1"

[tools]
list_research_resources = "0.4.0"
qrtk_factor_study = "0.4.0"
qrtk_expression_study = "0.4.0"
qrtk_read_study = "0.4.0"
qrtk_export_factor = "0.4.0"
qrtk_independent_test_request = "0.4.0"

[permissions]
data_paths = ["resource:catalog"]
write_scopes = ["research_runs"]
network = "none"
gpu = false
risk_level = "L0"
requires_approval = false

[budget]
max_iterations = 4
max_model_calls = 8
max_tool_calls = 6
max_jobs = 0
cpu_cores = 1
memory_mib = 4096
pids = 1
job_wall_seconds = 600
output_mib = 512

[acceptance]
cases = ["quant_research_smoke"]
stop_on = ["authorization_denied", "tool_error", "budget_exhausted"]

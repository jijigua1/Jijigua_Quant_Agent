version = "phase1-d-v1"
default_provider = "mock"

[providers.mock]
provider = "mock"
model = "mock-research-v1"
version = "1"
temperature = 0.0
max_output_tokens = 1024
timeout_seconds = 20.0
max_retries = 1

[providers.mock_alt]
provider = "mock-alt"
model = "mock-research-v2"
version = "1"
temperature = 0.0
max_output_tokens = 1024
timeout_seconds = 20.0
max_retries = 1

[providers.deepseek]
provider = "deepseek"
model = "deepseek-flash"
version = "v1beta-live-1"
temperature = 0.0
max_output_tokens = 4096
timeout_seconds = 60.0
max_retries = 1
credential_ref = "env:QRA_DEEPSEEK_API_KEY"
